[project]
name = "letx"
version = "1.0.0"
description = "CLI Tools - VUR Helper"
readme = "README.md"
authors = [
    { name = "gh0st4n", email = "darskevoid@gmail.com" }
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
letx = "letx.main:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
