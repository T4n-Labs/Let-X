[project]
name = "letx"
version = "1.0.0"
description = "CLI Tools - VUR Helper"
readme = "README.md"
authors = [
    { name = "gh0st4n", email = "darskevoid@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
  "os",
  "sys",
  "json",
  "re",
  "argparse",
  "urllib",
  "Path",
]

[project.scripts]
letx = "letx:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
